<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>freedesain.github.io | AI Image Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js"></script>
    <script type="text/javascript">
        aclib.runAutoTag({
            zoneId: 'osb3hunkkg',
        });
    </script>

    <style>
        :root {
            --bg-color: #0f111a;
            --panel-bg: rgba(25, 28, 41, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-blur: blur(12px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.1), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden; /* Mencegah geser horizontal */
        }

        /* === HEADER === */
        header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 17, 26, 0.9);
            backdrop-filter: var(--glass-blur);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand span {
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .header-actions button {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .header-actions button:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* === MAIN LAYOUT === */
        .app-container {
            display: flex;
            flex: 1;
            width: 100%;
        }

        /* === SIDEBAR (CONTROLS) === */
        .sidebar {
            width: 380px;
            background: var(--panel-bg);
            backdrop-filter: var(--glass-blur);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* Inputs */
        textarea, input[type="text"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus, input[type="text"]:focus {
            border-color: var(--accent);
        }

        /* Theme Selector */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .theme-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .theme-card:hover {
            background: rgba(139, 92, 246, 0.1);
        }

        .theme-card.active {
            border-color: var(--accent);
            background: rgba(139, 92, 246, 0.2);
            color: #fff;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
        }

        /* Sliders */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }

        /* Buttons */
        .btn-generate {
            background: linear-gradient(135deg, var(--accent), #3b82f6);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
        }

        /* === MAIN WORKSPACE (CANVAS) === */
        .workspace {
            flex: 1;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .canvas-container {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16/9;
            background: repeating-conic-gradient(rgba(255,255,255,0.03) 0% 25%, transparent 0% 50%) 50% / 20px 20px;
            background-color: rgba(0, 0, 0, 0.4);
            border: 2px dashed var(--border-color);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .upload-placeholder {
            text-align: center;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            padding: 15px;
        }

        .upload-placeholder h3 {
            font-size: 1rem;
        }

        .upload-icon {
            font-size: 2.5rem;
            opacity: 0.7;
        }

        .preview-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            z-index: 2;
        }

        /* Loading Animation */
        .loader-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 17, 26, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(139, 92, 246, 0.3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        .loader-text {
            font-weight: 500;
            font-size: 0.9rem;
            letter-spacing: 1px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* Toolbar Actions Over Canvas */
        .canvas-actions {
            position: absolute;
            bottom: 15px;
            display: flex;
            gap: 8px;
            z-index: 5;
            display: none; 
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 10px;
        }

        .action-btn {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: 0.2s;
        }

        .action-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* === RESPONSIVE MOBILE TWEAKS === */
        @media (max-width: 900px) {
            header {
                padding: 0 15px;
            }
            .brand {
                font-size: 1rem;
            }
            .app-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding: 15px;
            }
            .workspace {
                padding: 15px;
                min-height: 350px;
            }
            .canvas-container {
                aspect-ratio: 4/3; /* Lebih fleksibel di layar HP */
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">Free Desain By <span>AI Studio</span></div>
        <div class="header-actions">
            <button onclick="resetWorkspace()">Reset</button>
            <button style="background: var(--text-main); color: var(--bg-color);">Ekspor</button>
        </div>
    </header>

    <div class="app-container">
        <aside class="sidebar">
            <div class="control-group">
                <label>Prompt Utama (Deskripsi Imajinasi)</label>
                <textarea id="promptInput" rows="3" placeholder="Misal: Pemandangan kota cyberpunk neon di malam hari..."></textarea>
            </div>

            <div class="control-group">
                <label>Pilih Tema / Gaya Visual</label>
                <div class="theme-grid" id="themeGrid">
                    <div class="theme-card active" data-theme="realistik">📸 Realistik</div>
                    <div class="theme-card" data-theme="anime">🌸 Anime Style</div>
                    <div class="theme-card" data-theme="cyberpunk">🌃 Cyberpunk</div>
                    <div class="theme-card" data-theme="vector">✒️ Vector Art</div>
                    <div class="theme-card" data-theme="3d">🧊 3D Render</div>
                    <div class="theme-card" data-theme="sketch">✏️ Sketsa</div>
                </div>
            </div>

            <div class="control-group">
                <label style="display: flex; justify-content: space-between;">
                    <span>Tingkat Kreativitas AI</span>
                    <span id="creativityValue">75%</span>
                </label>
                <input type="range" id="creativitySlider" min="1" max="100" value="75">
            </div>

            <div class="control-group">
                <label style="display: flex; justify-content: space-between;">
                    <span>Kekuatan Referensi Gambar</span>
                    <span id="strengthValue">50%</span>
                </label>
                <input type="range" id="strengthSlider" min="1" max="100" value="50">
            </div>

            <button class="btn-generate" id="generateBtn">✨ Generate Gambar AI</button>
        </aside>

        <main class="workspace">
            <div class="canvas-container" id="dropZone">
                <div class="upload-placeholder" id="uploadPlaceholder">
                    <div class="upload-icon">📥</div>
                    <h3>Tarik & Lepas Gambar Referensi</h3>
                    <p style="font-size: 0.8rem;">atau klik untuk memilih file (Opsional)</p>
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                </div>

                <img id="imagePreview" class="preview-image" src="" alt="AI Output Preview">

                <div class="loader-overlay" id="loader">
                    <div class="spinner"></div>
                    <div class="loader-text">Memproses AI Render...</div>
                </div>

                <div class="canvas-actions" id="canvasActions">
                    <button class="action-btn">🔄 Variasi</button>
                    <button class="action-btn">🪄 Upscale</button>
                    <button class="action-btn" style="background: var(--text-main); color: var(--bg-color);">⬇️ Unduh</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const themeCards = document.querySelectorAll('.theme-card');
        themeCards.forEach(card => {
            card.addEventListener('click', () => {
                themeCards.forEach(c => c.classList.remove('active'));
                card.classList.add('active');
            });
        });

        const crSlider = document.getElementById('creativitySlider');
        const crValue = document.getElementById('creativityValue');
        crSlider.addEventListener('input', (e) => crValue.innerText = e.target.value + '%');

        const strSlider = document.getElementById('strengthSlider');
        const strValue = document.getElementById('strengthValue');
        strSlider.addEventListener('input', (e) => strValue.innerText = e.target.value + '%');

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const imagePreview = document.getElementById('imagePreview');
        const canvasActions = document.getElementById('canvasActions');

        dropZone.addEventListener('click', (e) => {
            if(e.target === dropZone || e.target.closest('.upload-placeholder')) {
                fileInput.click();
            }
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--accent)';
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--border-color)';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--border-color)';
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', function() {
            if (this.files.length) {
                handleFile(this.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadPlaceholder.style.display = 'none';
                imagePreview.src = e.target.result;
                imagePreview.style.display = 'block';
                canvasActions.style.display = 'flex';
            };
            reader.readAsDataURL(file);
        }

        const generateBtn = document.getElementById('generateBtn');
        const loader = document.getElementById('loader');

        generateBtn.addEventListener('click', () => {
            const promptVal = document.getElementById('promptInput').value;
            if(!promptVal && uploadPlaceholder.style.display !== 'none') {
                alert("Silakan masukkan teks prompt atau unggah gambar referensi terlebih dahulu!");
                return;
            }

            loader.style.display = 'flex';
            canvasActions.style.display = 'none';
            generateBtn.disabled = true;
            generateBtn.innerText = "Memproses...";

            setTimeout(() => {
                loader.style.display = 'none';
                
                if(uploadPlaceholder.style.display !== 'none') {
                    uploadPlaceholder.style.display = 'none';
                    imagePreview.src = "https://picsum.photos/seed/" + Math.random() + "/800/450";
                    imagePreview.style.display = 'block';
                }

                canvasActions.style.display = 'flex';
                generateBtn.disabled = false;
                generateBtn.innerText = "✨ Generate Gambar AI";
            }, 3000);
        });

        function resetWorkspace() {
            document.getElementById('promptInput').value = '';
            imagePreview.src = '';
            imagePreview.style.display = 'none';
            canvasActions.style.display = 'none';
            uploadPlaceholder.style.display = 'flex';
            fileInput.value = '';
        }
    </script>
</body>
</html>
